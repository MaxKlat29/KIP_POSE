# kip-pose-viewer orchestration.
#
# NOTE: yolo-svc and fp-svc build FROM the locally-built `foundationpose:ampere`
#       image (torch cu128, opencv, numpy; sm_86 source-built pytorch3d/nvdiffrast
#       for the RTX 3090 — see S-001 / recon/S001_BUILD_REPORT.md). Build that
#       image first (docker/Dockerfile.ampere in the FoundationPose checkout).
#       gigapose-svc builds FROM the locally-built `gigapose:ampere` image (a
#       SEPARATE base — GigaPose pins xformers/pytorch-lightning against an older
#       torch and cannot reuse foundationpose:ampere); build that image too
#       (docker/Dockerfile.ampere in the GigaPose checkout), and make sure the
#       GigaPose checkout has rendered templates (datasets/templates/kip2) before
#       starting gigapose-svc.
#       All GPU services also require the NVIDIA Container Toolkit
#       (nvidia-container-toolkit) so Docker can expose the GPU.
#
# WEIGHTS (S-006/S-009): pretrained weights live OUTSIDE the repo at
#       /mnt/data/kip_pose_weights (read-only) and are bind-mounted into the
#       service-expected layout. fp-svc mounts the FoundationPose `weights/` dir;
#       gigapose-svc gets gigaPose_v1.ckpt + the megapose-models symlink wired
#       into its checkout's pretrained/ (the store is mounted at the same absolute
#       path inside the container so those symlinks resolve). Override via .env
#       (FP_WEIGHTS_DIR, GIGAPOSE_WEIGHTS_STORE, BOP_WEIGHTS_DIR).
#
# Host paths are configurable via .env (copy .env.example to .env and adjust).
# The defaults assume FoundationPose/ and GigaPose/ are checked out as siblings
# of this repo; relative paths are resolved against the directory containing
# this compose file.
#   FOUNDATIONPOSE_DIR  FoundationPose checkout (code + weights)
#   GIGAPOSE_DIR        GigaPose checkout (code, pretrained/, datasets/, templates)
#   YOLO_WEIGHTS_PT     YOLO26n-seg checkpoint (.pt); a copy is bundled at
#                       ./assets/weights/best.pt
#   HF_CACHE_DIR        HuggingFace cache holding the gated facebook/sam3
#                       snapshot (for sam3-svc; offline at runtime)
#
# The frontend is run separately in dev mode (cd frontend && npm install && npm run dev)
# and is not part of this compose file.

services:
  yolo-svc:
    build: ./yolo-svc
    ports:
      - "8001:8001"
    environment:
      YOLO_WEIGHTS: /weights/best.pt
    volumes:
      # YOLO segmentation weights, read-only. Default: copy bundled in this repo;
      # override YOLO_WEIGHTS_PT in .env to use a checkpoint from a training run.
      # S-006 NOTE: the only interim weight on the box (/mnt/data/kip_pose/yolo26n.pt)
      # is STOCK COCO (task=detect, 80 classes) — it produces NO anker masks. A real
      # anker instance-seg model (S-008 / T-134, YOLO26m-seg, 2 classes) is the actual
      # source for combos 2/4/5. yolo-seg-svc is infra-green (build/health/request) but
      # needs that checkpoint before it returns useful masks.
      - ${YOLO_WEIGHTS_PT:-./assets/weights/best.pt}:/weights/best.pt:ro
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  fp-svc:
    build: ./fp-svc
    ports:
      - "8002:8002"
    volumes:
      # FoundationPose code, read-only. Default: sibling checkout.
      # NOTE: the foundationpose:ampere image is a BASE image (no FP repo baked);
      # the FP code (incl. the mycpp C++ extension) comes from this mount. mycpp
      # must be compiled once into the checkout (bash build_mycpp.sh -> mycpp/build/
      # *.so) or fp-svc fails at startup with "module 'mycpp' has no attribute
      # 'cluster_poses'". See S-006 report.
      - ${FOUNDATIONPOSE_DIR:-../FoundationPose}:/workspace/FoundationPose:ro
      # Pretrained FP refiner+scorer weights, read-only, mounted into the layout
      # the estimator expects (FP_REPO/weights/<timestamp>/model_best.pth).
      # S-009 placed them at /mnt/data/kip_pose_weights/foundationpose/weights.
      # The host FP checkout must contain an (empty) weights/ dir as the mountpoint,
      # because this overlays a subdir of the read-only FP repo mount above.
      - ${FP_WEIGHTS_DIR:-/mnt/data/kip_pose_weights/foundationpose/weights}:/workspace/FoundationPose/weights:ro
      # CAD meshes (metres), read-only.
      - ${FP_MESH_DIR:-./assets/meshes}:/assets/meshes:ro
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  gigapose-svc:
    build: ./gigapose-svc
    ports:
      - "8003:8003"
    volumes:
      # GigaPose checkout: code + checkpoints (pretrained/), CAD (datasets/kip2/models),
      # rendered templates (datasets/templates/kip2) and the DINOv2 torch-hub cache
      # (torch_cache/). Mounted rw so the template loader can write its preprocessed
      # cache; all weights stay on the host (not baked into the image).
      # Default: sibling checkout.
      # NOTE (S-006): templates were NOT pre-rendered on the box — render once with
      #   python -m src.scripts.render_custom_templates custom_dataset_name=kip2
      # (panda3d/EGL, ~13s for 2 objects x 162 views) before first start.
      - ${GIGAPOSE_DIR:-../GigaPose}:/workspace/GigaPose
      # Pretrained store (S-009), read-only, at the SAME absolute path so the
      # symlinks pretrained/gigaPose_v1.ckpt + pretrained/megapose-models (which
      # point at /mnt/data/kip_pose_weights/...) resolve inside the container.
      - ${GIGAPOSE_WEIGHTS_STORE:-/mnt/data/kip_pose_weights}:/mnt/data/kip_pose_weights:ro
      # megapose-models live on /mnt/data/bop/weights (the symlink target), also ro.
      - ${BOP_WEIGHTS_DIR:-/mnt/data/bop/weights}:/mnt/data/bop/weights:ro
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  sam3-svc:
    build: ./sam3-svc
    ports:
      - "8004:8004"
    environment:
      # facebook/sam3 is gated on HF: weights must already sit in the mounted
      # cache (accept the license + download once on the host). Offline mode
      # keeps the service from ever touching the network.
      HF_HOME: /hf-cache
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      # Tuning knobs (see sam3-svc/app.py). NOTE: the per-class text prompts
      # find armature instances well but do NOT reliably separate anker_kurz
      # from anker_lang (measured: a mixed scene came back all-anker_lang).
      # Treat SAM3 classes as approximate; YOLO remains the classifying source.
      SAM3_CONF: ${SAM3_CONF:-0.2}
      SAM3_NMS_IOU: ${SAM3_NMS_IOU:-0.5}
      SAM3_PROMPTS: ${SAM3_PROMPTS:-}
    volumes:
      # Host HuggingFace cache with the facebook/sam3 snapshot, read-only.
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/hf-cache:ro
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    environment:
      YOLO_URL: http://yolo-svc:8001
      FP_URL: http://fp-svc:8002
      GIGAPOSE_URL: http://gigapose-svc:8003
      SAM3_URL: http://sam3-svc:8004
    depends_on:
      - yolo-svc
      - fp-svc
      - gigapose-svc
      - sam3-svc
