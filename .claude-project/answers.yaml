# answers.yaml — POSE concept dialog answers (ml profile)
# Built from Max's brief + .research/sota-brief.md
# Methode: FoundationPose + CNOS + BlenderProc4BOP, RGB-D Top-Down.

vision:
  elevator_pitch: "Eine ML-Pipeline die aus einem Top-Down-Foto einer Tischplatte erkennt, welche bekannten Bauteile dort liegen und in welcher 6D-Pose — sodass ein Roboterarm die Teile greifen kann."
  problem: "Aktuell kann der Roboterarm Bauteile auf einer Tischplatte nicht autonom aufnehmen, weil ihm fehlt zu wissen WAS, WO und WIE GEDREHT die Teile liegen. CAD-Modelle aller Bauteile sind vorhanden, aber es gibt keinen Vision-Layer der diese mit einer Top-Down-Kamera-Aufnahme verheiratet. Klassische 2D-Detection reicht nicht — der Roboter braucht die volle 6D-Pose (3D-Position + 3D-Rotation) jedes Teils, um sicher greifen zu koennen."
  success_outcome: "Der Roboter sieht eine Tischplatte voller Schrauben, Muttern und Kleinteile, weiss innerhalb von <1s pro Frame welches Teil wo liegt, und kann sie eins nach dem anderen sicher aufnehmen. Endprodukt-Demo: ein Three.js-Clickdummy zeigt links das Kamerabild, rechts die rekonstruierte 3D-Szene mit CAD-Modellen exakt platziert — Top-Down-Bild rein, 3D-Welt-Rekonstruktion raus."
  why_now: "Wir haben aktuell die Hardware (Roboterarm + 3D-Kamera + Tisch), die CAD-Bibliothek aller Bauteile, und bereits eine Physics-Simulation die uns Trainingsdaten mit Ground-Truth-Labels generiert. Was fehlt ist der ML-Layer dazwischen. SOTA-Methoden (FoundationPose, CNOS) sind 2024/2025 robust genug geworden, dass synthetic-only Training realistisch funktioniert."
  ml_task_type: classification
  success_definition_quant: "Average Recall (BOP-Metric) >= 0.70 auf unserem eigenen Test-Set, Translation-Error < 5mm, Rotation-Error < 5 Grad. Inference-Zeit < 1s pro Frame auf RTX 3090. Detection-Recall >= 0.90 fuer Bauteile mit >= 50px Grosse im Bild."

users:
  primary_user: "Roboterarm-Pipeline (downstream-Konsument), entwickelt von uns selbst. Im v0.1 ein Clickdummy-Operator der die Visualisierung anschaut."
  primary_use_case: "Pro Pick-Zyklus ein Top-Down-Frame aufnehmen, Pipeline schickt {object_id, pose_4x4, confidence}-Liste an Greifplaner. Frequenz: einmal pro Pick-Zyklus, typischerweise alle 5-15s waehrend aktiver Arbeit."
  secondary_use_cases: "Spaeter: kontinuierliches Multi-Frame-Tracking. Spaeter: Sim-to-Sim-Eval-Harness fuer neue CAD-Modelle. Spaeter: ROS2-Node-Wrapper. v0.1 ist Single-Shot pro Frame."
  consumer_of_output: downstream_pipeline_automated

stack:
  language_pref: python
  existing_codebase: "Physics-Simulation in Blender/Python existiert bereits separat (CAD-Modelle auf Tischplatte fallen lassen, Ground-Truth-Pose-Labels generieren). Diese wird ueber BlenderProc4BOP-Standard ersetzt/angepasst."
  deployment_target: local_cli
  privacy_constraint: strictly_local
  model_source: use_open_source_as_is
  inference_location: local_gpu_workstation
  data_volume: medium_under_10m_rows
  data_storage: parquet

constraints:
  time_budget: "5_to_10h"
  deadline: "Keine harte Deadline. Konzept jetzt, Clickdummy in den naechsten Wochen, Production-Pipeline danach."
  risks_unknowns: "Sim2Real-Gap koennte groesser sein als erwartet (synthetic-only reicht eventuell nicht). RGB-D-Kamera-Kalibrierung muss sauber sein. Reflektierende Metallteile sind klassischer Failure-Case fuer Depth-Kameras. Planar-Constraint-Postprocessing braucht stabile-Liegelagen-Vorberechnung pro CAD-Modell. FoundationPose ist NVIDIA-Stack-gebunden (CUDA-only)."
  explicit_non_goals: "Kein Multi-Object-Tracking ueber Zeit (v0.1 nur Single-Frame). Keine eigene Pose-Refinement-Erfindung (wir nehmen FoundationPose-Refiner). Kein Greif-Planung-Algorithmus (out of scope). Keine Cloud-Inference. Keine Realtime-30fps-Anforderung. Kein eigenes Pose-Modell-Training (wir nehmen vortrainiertes FoundationPose)."
  training_compute_budget: local_workstation_only
  reproducibility_strict: seed_pinned_only

success_metrics:
  quant_metrics: "BOP Average Recall >= 0.70 auf eigenem Test-Set. Translation-Error Median < 5mm. Rotation-Error Median < 5 Grad. Inference < 1s pro Frame. Detection-Recall >= 0.90 fuer Teile >= 50px."
  qual_signals: "Im Clickdummy lade ich ein Top-Down-Bild und sehe rechts eine 3D-Szene wo alle CAD-Modelle sichtbar korrekt platziert sind — ich kann das Three.js-Modell rotieren und visuell pruefen ob die Pose stimmt. Bei 10 Test-Bildern sind 8+ visuell ueberzeugend."
  must_have_features: |
    - BlenderProc4BOP-basierte Synth-Data-Pipeline: CAD-Modelle auf simulierten Tisch fallen lassen, Top-Down-Rendering mit PBR + Domain-Randomization, BOP-Format-Output (Pose, Mask, Depth, RGB).
    - CNOS-basierte Detection + Segmentation (CAD-template-driven, unseen-objects-faehig).
    - FoundationPose-Integration (RGB-D, pretrained, kein eigenes Training).
    - Stable-Pose-Snapping-Postprocessing-Layer (CAD-Analyse pro Bauteil: stabile Liegelagen vorberechnen, predicted Pose auf naechste Lage projizieren).
    - Inference-CLI: nimmt Bild + Liste der CAD-Modelle, gibt JSON {object_id, pose_4x4, confidence} zurueck.
    - Three.js-Clickdummy: Top-Down-Image links, 3D-Szene mit CAD-Platzierung rechts, drag-rotate.
    - Eval-Harness: vergleicht Predictions vs Ground-Truth aus Simulation (BOP-Metriken).
  nice_to_have: |
    - Multi-Frame-Tracking ueber Zeit.
    - ROS2-Node-Wrapper.
    - Echte Realsense-D435-Live-Capture-Integration.
    - GigaPose RGB-only-Fallback fuer Setups ohne Depth-Kamera.
    - FreeZeV2 als training-free Alternative.
    - WebGL-Live-Preview waehrend Pipeline laeuft.

evaluation:
  eval_dataset_source: holdout_split_of_train
  human_in_loop: occasional_spot_check
